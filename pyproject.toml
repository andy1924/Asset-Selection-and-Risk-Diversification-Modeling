[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-selection-risk-modeling"
version = "0.1.0"
description = "Portfolio risk-tag counting with inclusion-exclusion and Boolean policy checks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Education",
]

[project.scripts]
portfolio-risk-demo = "portfolio_risk.model:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["portfolio_risk*"]
